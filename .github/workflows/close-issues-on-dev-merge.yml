# GitHub автоматически закрывает задачи по "Closes #N" только при мерже в ветку по умолчанию (main).
# У нас разработка идёт в dev, поэтому закрываем задачи сами при мерже PR в dev.
# Карточка в GitHub Project уезжает в Done встроенным workflow проекта "Item closed".
name: Close linked issues on merge to dev

on:
  pull_request:
    types: [closed]
    branches: [dev]

permissions:
  issues: write
  pull-requests: read

jobs:
  close-issues:
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    steps:
      - name: Close issues referenced with closing keywords
        uses: actions/github-script@v7
        with:
          script: |
            const pr = context.payload.pull_request;
            const text = `${pr.title}\n${pr.body ?? ''}`;

            // close/closes/closed, fix/fixes/fixed, resolve/resolves/resolved + #N
            // Поддерживает "Closes #3", "fixes: #4", "Resolves #5, #6"
            const keyword = /\b(?:close[sd]?|fix(?:e[sd])?|resolve[sd]?)\b:?\s+((?:#\d+[\s,]*(?:and\s+)?)+)/gi;
            const numbers = new Set();
            for (const match of text.matchAll(keyword)) {
              for (const ref of match[1].matchAll(/#(\d+)/g)) numbers.add(Number(ref[1]));
            }

            if (numbers.size === 0) {
              core.info('No closing keywords found in PR title/body.');
              return;
            }

            const { owner, repo } = context.repo;
            for (const issue_number of numbers) {
              try {
                const { data: issue } = await github.rest.issues.get({ owner, repo, issue_number });
                if (issue.pull_request) {
                  core.info(`#${issue_number} is a pull request, skipping.`);
                  continue;
                }
                if (issue.state === 'closed') {
                  core.info(`#${issue_number} is already closed.`);
                  continue;
                }
                await github.rest.issues.createComment({
                  owner, repo, issue_number,
                  body: `Закрыто мержем #${pr.number} в \`${pr.base.ref}\`.`,
                });
                await github.rest.issues.update({
                  owner, repo, issue_number,
                  state: 'closed',
                  state_reason: 'completed',
                });
                core.info(`Closed #${issue_number}.`);
              } catch (error) {
                core.warning(`Could not close #${issue_number}: ${error.message}`);
              }
            }
