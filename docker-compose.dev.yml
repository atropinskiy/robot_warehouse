services:
  nginx:
    image: nginx:1.27-alpine
    container_name: nginx-dev
    ports:
      - "80:80" # Единственная публичная точка входа
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      frontend:
        condition: service_healthy
      backend:
        condition: service_healthy
    restart: unless-stopped

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: nestjs-backend-dev
    ports:
      - "4000:3000" # Оставляем прямой доступ для тестов
    environment:
      - NODE_ENV=development
    command: pnpm run start:dev
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000/').then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    develop:
      watch:
        # NestJS перезагружает приложение при изменениях исходников.
        - path: ./backend/src
          action: sync
          target: /app/backend/src
        - path: ./backend/package.json
          action: rebuild
        - path: ./backend/pnpm-lock.yaml
          action: rebuild
        - path: ./backend/Dockerfile
          action: rebuild

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    container_name: nextjs-frontend-dev
    # Порты наружу НЕ пробрасываем — доступ только через nginx
    expose:
      - "3000"
    volumes:
      - /app/frontend/.next
    environment:
      - NODE_ENV=development
      - WATCHPACK_POLLING=true
      # URL для серверных запросов (SSR) внутри Docker-сети:
      - INTERNAL_API_URL=${INTERNAL_API_URL:-http://backend:4000}
      # URL для клиентских запросов (браузер) — идёт через nginx:
      - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL:-/api}
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000/').then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 45s
    develop:
      watch:
        - path: ./frontend/app
          action: sync
          target: /app/frontend/app
        - path: ./frontend/public
          action: sync
          target: /app/frontend/public
        - path: ./frontend/next.config.ts
          action: sync+restart
          target: /app/frontend/next.config.ts
        - path: ./frontend/tsconfig.json
          action: sync+restart
          target: /app/frontend/tsconfig.json
        - path: ./frontend/package.json
          action: rebuild
        - path: ./frontend/pnpm-lock.yaml
          action: rebuild
        - path: ./frontend/Dockerfile
          action: rebuild